[package]
name = "dedalo"
description = "Merge-to-earn funding for open source: turn git merges into contributor payouts."
keywords = ["git", "open-source", "funding", "payouts", "web3"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# `cargo binstall dedalo` fetches the release archive instead of compiling.
# The layout below must match what .github/workflows/release.yml publishes.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/dedalo-v{ version }-{ target }{ archive-suffix }"
bin-dir = "dedalo-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "dedalo"
path = "src/main.rs"

[dependencies]
dedalo-core.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
dedalo-core = { workspace = true, features = ["testing"] }
predicates.workspace = true
serde_json.workspace = true
tempfile.workspace = true
