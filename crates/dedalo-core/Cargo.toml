[package]
name = "dedalo-core"
description = "Core engine for Dedalo: turns git merges into deterministic, on-chain contributor payouts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Exposes `dedalo_core::testing`, a harness for building throwaway
# repositories. Off by default so it never ships in a normal build.
testing = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
async-trait.workspace = true
sha2.workspace = true
hex.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
