[package]
name = "dedalo"
description = "Merge-to-earn funding for open source: turn git merges into deterministic contributor payouts."
version = "0.0.0"
edition = "2024"
rust-version = "1.90.0"
license = "MIT"
repository = "https://github.com/dedalo-org/dedalo"
homepage = "https://dedalo-org.github.io/"
documentation = "https://docs.rs/dedalo"
authors = ["Dedalo contributors"]
readme = "README.md"
keywords = ["git", "funding", "payouts", "open-source", "web3"]
categories = ["command-line-utilities", "development-tools"]

# The published archive carries what someone building or auditing the crate
# needs, and nothing that only serves the repository.
exclude = [
  "/.github",
  "/site",
  "/.dedalo",
  # This project's own funding rules: a real record, but not a consumer's.
  "/dedalo.toml",
  "/scripts",
  # The handbook is published; it is not something a consumer of the crate
  # unpacks. docs.rs builds the API reference from the source instead.
  "/book",
  "/action.yml",
  "/install.sh",
  "/cliff.toml",
  "/deny.toml",
  "/taplo.toml",
  # The contract source ships; its build output does not.
  "/src/chain/contract/target",
]

[features]
default = ["cli"]

# The command-line interface, and the runtime and argument parsing it needs.
# A library consumer turns this off — `default-features = false` — and pulls
# in none of it.
cli = ["dep:anyhow", "dep:clap", "dep:toml_edit", "dep:tokio", "dep:tracing-subscriber", "dep:libc"]

# Exposes `dedalo::testing`, a harness for building throwaway repositories
# with real merge history. Off by default so it never ships in a normal build.
testing = []

[[bin]]
name = "dedalo"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# The library.
async-trait = "0.1"
# Solana addresses are base58 and nothing else — no prefix, no checksum, no
# separator. bs58 is the encoder everything in that ecosystem uses and pulls
# in nothing.
bs58 = "0.5"
# Decompressing an address to a curve point is the only structural check a
# Solana address admits: base58 that decodes to thirty-two bytes is otherwise
# always "valid". This is what tells a wallet apart from a program-derived
# address, and it is worth a dependency because doing field arithmetic by hand
# in a payments tool is not.
curve25519-dalek = { version = "5", default-features = false, features = ["alloc"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
tracing = "0.1"

# The CLI, behind the `cli` feature.
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }
toml_edit = { version = "0.23", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
# The integration tests need the `testing` harness, which a normal build must
# not ship. A crate may depend on itself for dev only, which is what turns the
# feature on for tests without turning it on for consumers.
dedalo = { path = ".", features = ["testing"] }
assert_cmd = "2"
predicates = "3"
proptest = "1"
tempfile = "3"

# docs.rs builds the API reference, per released version, in a sandbox with no
# network and a time limit. Rehearse a change here with `cargo docs-rs`, which
# builds the same way it does — a crate that builds locally can still fail
# there, and when it does the crate page shows a build failure to everyone who
# follows the link from the README.
[package.metadata.docs.rs]
# `cli` and `testing` both gate public items, and a reference that omits them
# is a reference to a crate nobody has. `--cfg docsrs` is what makes each one
# say which feature it needs; see the `doc_cfg` attribute in src/lib.rs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
# One target, not five. Nothing public varies by platform — the only `cfg(unix)`
# in the crate is a private signal handler — so building the other four costs
# docs.rs time for an identical page, and a timeout there is a failed build
# page rather than a slow one.
targets = ["x86_64-unknown-linux-gnu"]

# `cargo binstall dedalo` fetches the release archive instead of compiling.
# The layout below must match what .github/workflows/release.yml publishes.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/dedalo-v{ version }-{ target }{ archive-suffix }"
bin-dir = "dedalo-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[profile.release]
lto = "thin"
strip = true
