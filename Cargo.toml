[package]
name = "dedalo"
description = "Merge-to-earn funding for open source: turn git merges into deterministic contributor payouts. 0.0.0 is a name reservation and ships no functionality."
version = "0.0.0"
edition = "2024"
rust-version = "1.90.0"
license = "MIT"
repository = "https://github.com/dedalo-org/dedalo"
homepage = "https://dedalo-org.github.io/"
documentation = "https://docs.rs/dedalo"
authors = ["Dedalo contributors"]
readme = "README.md"
keywords = ["git", "funding", "payouts", "open-source", "web3"]
categories = ["command-line-utilities", "development-tools"]

# The published archive carries what someone building or auditing the crate
# needs, and nothing that only serves the repository. The list is longer than
# the placeholder warrants because it is the list the real crate ships with,
# and a release should not have to rediscover it.
exclude = [
  "/.github",
  "/site",
  # This project's own funding rules: a real record, but not a consumer's.
  "/dedalo.toml",
  "/scripts",
  # The handbook is published; it is not something a consumer of the crate
  # unpacks. docs.rs builds the API reference from the source instead.
  "/book",
  "/action.yml",
  "/install.sh",
  "/cliff.toml",
  "/deny.toml",
  "/taplo.toml",
]

[[bin]]
name = "dedalo"
path = "src/main.rs"

[dependencies]
# None. A placeholder that pulls in a dependency tree is a placeholder that
# can break someone's build, and this one has nothing to break it for.

[dev-dependencies]
# Only what `tests/verification_manifest.rs` needs to read `verification.toml`.
# The gate outlives the code it was written for: it is what fails the build if
# a module appears here without someone deciding how it is verified.
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# `cargo binstall dedalo` fetches the release archive instead of compiling.
# The layout below must match what .github/workflows/release.yml publishes.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/dedalo-v{ version }-{ target }{ archive-suffix }"
bin-dir = "dedalo-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[profile.release]
lto = "thin"
strip = true
