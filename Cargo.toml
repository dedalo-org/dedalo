[workspace]
resolver = "3"
members = ["crates/dedalo-core", "crates/dedalo-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
repository = "https://github.com/dedalo-org/dedalo"
authors = ["Dedalo contributors"]

[workspace.dependencies]
dedalo-core = { path = "crates/dedalo-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.23"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"

# Test-only
proptest = "1"
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
