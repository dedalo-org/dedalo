# Path-based labels applied to pull requests by .github/workflows/triage.yml.

"area: money":
  - changed-files:
      - any-glob-to-any-file:
          - src/money.rs
          - src/treasury.rs
          - src/payout.rs
          - src/wallet.rs

"area: attribution":
  - changed-files:
      - any-glob-to-any-file:
          - src/attribution.rs
          - src/identity.rs

"area: git":
  - changed-files:
      - any-glob-to-any-file:
          - src/git/**

"area: settlement":
  - changed-files:
      - any-glob-to-any-file:
          - src/settlement/**
          - src/ledger.rs

"area: cli":
  - changed-files:
      - any-glob-to-any-file:
          - src/cli/**

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - site/**

infrastructure:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - deny.toml
          - action.yml
          - install.sh
          - rust-toolchain.toml
