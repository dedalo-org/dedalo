name: Tag

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  tag:
    name: tag the merged release
    # Only a merged pull request that the Version workflow labelled.
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # Tags are created through the API rather than by pushing, so no
      # credential is ever written into .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Read the version that was merged
        id: version
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          {
            printf 'version=%s\n' "$version"
            printf 'tag=v%s\n' "$version"
            printf 'major=v%s\n' "${version%%.*}"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse to move a tag that already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error title=Tag exists::${TAG} is already published; a released tag must never move"
            exit 1
          fi

      - name: Create the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          set -euo pipefail

          # An annotated tag object, then the ref that points at it.
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$TAG" -f message="$TAG" \
            -f object="$GITHUB_SHA" -f type=commit --jq '.sha')
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" -f sha="$tag_sha" >/dev/null
          echo "Created $TAG" >> "$GITHUB_STEP_SUMMARY"

          # The major tag is the one that moves: `uses: dedalo-org/dedalo@v0` has
          # to follow the latest release. It points at an immutable release
          # tag, so nothing already published changes underneath anyone.
          major_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$MAJOR" -f message="Latest ${MAJOR}.x release (${TAG})" \
            -f object="$GITHUB_SHA" -f type=commit --jq '.sha')
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${MAJOR}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${MAJOR}" \
              -f sha="$major_sha" -F force=true >/dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${MAJOR}" -f sha="$major_sha" >/dev/null
          fi
          echo "Moved $MAJOR to $TAG" >> "$GITHUB_STEP_SUMMARY"

  # Called directly rather than relying on a push event, which GITHUB_TOKEN
  # cannot raise.
  release:
    name: release
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
      packages: write
    # No `secrets:` and emphatically not `inherit`. The release workflow needs
    # none: crates.io mints a thirty-minute token from an OIDC claim, so
    # nothing crosses this boundary that could be leaked or reused.
