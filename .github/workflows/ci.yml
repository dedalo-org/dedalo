name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    env:
      # Outranks rust-toolchain.toml, which would otherwise win.
      RUSTUP_TOOLCHAIN: stable
    timeout-minutes: 15
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    env:
      # Outranks rust-toolchain.toml, which would otherwise win.
      RUSTUP_TOOLCHAIN: stable
    timeout-minutes: 25
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # Attribution reads merge history; a shallow clone hides it.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Configure git for the end-to-end tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: cargo test
        run: cargo test --locked --workspace --all-features

  msrv:
    timeout-minutes: 15
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Without this the job passed vacuously: rust-toolchain.toml pins 1.91.1
      # and outranks `rustup default`, so the MSRV was never actually built.
      # Asserting the version means it can never silently drift again.
      - name: The toolchain in use must be the declared MSRV
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
          EXPECTED: ${{ steps.msrv.outputs.version }}
        run: |
          set -euo pipefail
          actual=$(rustc --version | cut -d' ' -f2)
          echo "rustc $actual (expecting $EXPECTED)"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error title=Wrong toolchain::the MSRV job is building with $actual, not $EXPECTED"
            exit 1
          fi

      - name: cargo check on the declared MSRV
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --locked --workspace --all-features --all-targets

  docs:
    env:
      # Outranks rust-toolchain.toml, which would otherwise win.
      RUSTUP_TOOLCHAIN: nightly
    timeout-minutes: 20
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo doc
        # Broken intra-doc links and undocumented public items fail the build:
        # the API reference is generated, so it has to stay correct.
        env:
          RUSTDOCFLAGS: -D warnings --cfg docsrs
        run: cargo doc --locked --workspace --no-deps --all-features

  coverage:
    env:
      # Outranks rust-toolchain.toml, which would otherwise win.
      RUSTUP_TOOLCHAIN: stable
    timeout-minutes: 30
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Configure git for the end-to-end tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: cargo llvm-cov
        run: cargo llvm-cov --locked --workspace --all-features --lcov --output-path lcov.info
      - name: Summarise
        run: cargo llvm-cov report --summary-only >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: lcov.info

  packaging:
    env:
      # Outranks rust-toolchain.toml, which would otherwise win.
      RUSTUP_TOOLCHAIN: stable
    name: packaging and distribution
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install musl tooling
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # The release builds musl binaries. A target that stops compiling should
      # fail a pull request, not a tag.
      - name: Build the release target
        run: cargo build --release --locked -p dedalo --target x86_64-unknown-linux-musl

      - name: The binary must be static
        run: |
          set -euo pipefail
          binary=target/x86_64-unknown-linux-musl/release/dedalo
          file "$binary"
          # Ask the ELF headers, not ldd: its wording depends on the libc and
          # on whether the binary is static-pie ("statically linked") or a
          # plain static ("not a dynamic executable"). A binary with no shared
          # dependencies has no NEEDED entries, whichever form it takes.
          if readelf -d "$binary" 2>/dev/null | grep -q 'NEEDED'; then
            readelf -d "$binary" | grep 'NEEDED' || true
            echo "::error title=Not static::the musl build links against shared libraries"
            exit 1
          fi
          echo "static: no NEEDED entries in the dynamic section"

      # Exercise the Dockerfile exactly as the release does, then prove the
      # image works on a repository it did not build: non-root user, git
      # safe.directory, entrypoint arguments.
      - name: Build the container image
        run: |
          set -euo pipefail
          mkdir -p image/amd64
          cp target/x86_64-unknown-linux-musl/release/dedalo image/amd64/dedalo
          docker build -t dedalo:ci .

      - name: The image runs against a mounted repository
        run: |
          set -euo pipefail

          docker run --rm dedalo:ci --version

          # Read-only, as the image's own non-root user, against a checkout it
          # does not own. This is what trips git's safe.directory guard if the
          # image forgets to set it.
          docker run --rm -v "$PWD:/repo:ro" dedalo:ci scan --limit 1
          docker run --rm -v "$PWD:/repo:ro" dedalo:ci --json contributors > /dev/null

          # The write path needs the caller's uid, since a host checkout is not
          # owned by the image's user. If this breaks, `dedalo init` in a
          # container is broken, which is most of the point of shipping one.
          #
          # Built from scratch rather than cloned from the workspace: a CI
          # checkout is a detached HEAD with no local branches, so a clone of
          # it has nothing for `dedalo` to read.
          work="$(mktemp -d)/repo"
          mkdir -p "$work"
          git -C "$work" init -q -b main
          git -C "$work" config user.email ci@example.com
          git -C "$work" config user.name CI
          echo seed > "$work/README.md"
          git -C "$work" add -A
          git -C "$work" commit -qm "Initial commit"
          git -C "$work" checkout -q -b feature
          printf 'a\nb\nc\n' > "$work/feature.txt"
          git -C "$work" add -A
          git -C "$work" commit -qm "Add a feature"
          git -C "$work" checkout -q main
          git -C "$work" merge -q --no-ff feature -m "Merge pull request: feature"

          docker run --rm -u "$(id -u):$(id -g)" -v "$work:/repo" \
            dedalo:ci init --name container-smoke --force
          docker run --rm -u "$(id -u):$(id -g)" -v "$work:/repo" \
            dedalo:ci plan --amount 1000 --save
          test -f "$work/.dedalo/ledger.jsonl" \
            || { echo "::error title=Image cannot write::plan --save left no ledger"; exit 1; }
          echo "container writes to a mounted repository as the calling user"

      - name: install.sh fails safely on a version that does not exist
        run: |
          set -euo pipefail
          out=$(DEDALO_VERSION=v0.0.0-does-not-exist \
                DEDALO_INSTALL="$RUNNER_TEMP/bin" sh install.sh 2>&1 || true)
          printf '%s\n' "$out"
          case "$out" in
            *"no build for"*|*"releases"*) echo "failed with a usable message" ;;
            *) echo "::error title=Bad failure mode::install.sh did not explain itself"; exit 1 ;;
          esac
          if [ -e "$RUNNER_TEMP/bin/dedalo" ]; then
            echo "::error title=Unsafe install::a failed download still installed something"
            exit 1
          fi

  semver:
    env:
      # Outranks rust-toolchain.toml, which would otherwise win.
      RUSTUP_TOOLCHAIN: stable
    name: public api compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cargo-semver-checks
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Reports breaking changes against the base branch. It does not fail the
      # build — pre-1.0 they are allowed — but they have to be seen and to end
      # up in the changelog as breaking.
      - name: cargo semver-checks
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cargo semver-checks --baseline-rev "$BASE" --package dedalo-core \
            2>&1 | tee "$RUNNER_TEMP/semver.txt"
          {
            echo '### Public API'
            echo '```'
            tail -40 "$RUNNER_TEMP/semver.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # A single gate for branch protection, so adding a job above does not
  # require reconfiguring the repository.
  ci-ok:
    timeout-minutes: 5
    name: CI
    if: always()
    needs: [lint, test, msrv, docs, coverage, packaging, semver]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all checks passed"
