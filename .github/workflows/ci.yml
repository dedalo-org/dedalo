name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    env:
      # Outranks rust-toolchain.toml, which would otherwise win.
      RUSTUP_TOOLCHAIN: stable
    timeout-minutes: 15
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    env:
      # Outranks rust-toolchain.toml, which would otherwise win.
      RUSTUP_TOOLCHAIN: stable
    timeout-minutes: 25
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Attribution reads merge history; a shallow clone hides it.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Configure git for the end-to-end tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: cargo test
        run: cargo test --locked --workspace --all-features

  msrv:
    timeout-minutes: 15
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Without this the job passed vacuously: rust-toolchain.toml pins 1.91.1
      # and outranks `rustup default`, so the MSRV was never actually built.
      # Asserting the version means it can never silently drift again.
      - name: The toolchain in use must be the declared MSRV
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
          EXPECTED: ${{ steps.msrv.outputs.version }}
        run: |
          set -euo pipefail
          actual=$(rustc --version | cut -d' ' -f2)
          echo "rustc $actual (expecting $EXPECTED)"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error title=Wrong toolchain::the MSRV job is building with $actual, not $EXPECTED"
            exit 1
          fi

      - name: cargo check on the declared MSRV
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --locked --workspace --all-features --all-targets

  docs:
    env:
      # Outranks rust-toolchain.toml, which would otherwise win.
      RUSTUP_TOOLCHAIN: nightly
    timeout-minutes: 20
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo doc
        # Broken intra-doc links and undocumented public items fail the build:
        # the API reference is generated, so it has to stay correct.
        env:
          RUSTDOCFLAGS: -D warnings --cfg docsrs
        run: cargo doc --locked --workspace --no-deps --all-features

  coverage:
    env:
      # Outranks rust-toolchain.toml, which would otherwise win.
      RUSTUP_TOOLCHAIN: stable
    timeout-minutes: 30
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Configure git for the end-to-end tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: cargo llvm-cov
        run: cargo llvm-cov --locked --workspace --all-features --lcov --output-path lcov.info
      - name: Summarise
        run: cargo llvm-cov report --summary-only >> "$GITHUB_STEP_SUMMARY"

      # Coverage used to be measured and never enforced: a number somebody
      # could look at, on a project whose README argues at length about the
      # difference between proved, property-tested and merely tested. A metric
      # with no threshold does not hold anything down.
      #
      # The floors are per module and declared in verification.toml, not here.
      # A single global percentage would be satisfied by testing the CLI's
      # table renderer and would say nothing about `money`.
      - name: Every module meets the floor it declares
        run: |
          set -uo pipefail
          cargo llvm-cov report --json --output-path coverage.json

          # Run once. Running it twice — once for the summary, once for the
          # exit code — would report a different number than it failed on if
          # anything about the run were not deterministic.
          set +e
          python3 scripts/check-coverage.py --coverage coverage.json \
            > "$RUNNER_TEMP/coverage.txt" 2>&1
          status=$?
          set -e

          cat "$RUNNER_TEMP/coverage.txt"
          {
            echo '### Coverage floors'
            echo '```'
            cat "$RUNNER_TEMP/coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info

  packaging:
    env:
      # Outranks rust-toolchain.toml, which would otherwise win.
      RUSTUP_TOOLCHAIN: stable
    name: packaging and distribution
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install musl tooling
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # The release builds musl binaries. A target that stops compiling should
      # fail a pull request, not a tag.
      - name: Build the release target
        run: cargo build --release --locked -p dedalo --target x86_64-unknown-linux-musl

      - name: The binary must be static
        run: |
          set -euo pipefail
          binary=target/x86_64-unknown-linux-musl/release/dedalo
          file "$binary"
          # Ask the ELF headers, not ldd: its wording depends on the libc and
          # on whether the binary is static-pie ("statically linked") or a
          # plain static ("not a dynamic executable"). A binary with no shared
          # dependencies has no NEEDED entries, whichever form it takes.
          if readelf -d "$binary" 2>/dev/null | grep -q 'NEEDED'; then
            readelf -d "$binary" | grep 'NEEDED' || true
            echo "::error title=Not static::the musl build links against shared libraries"
            exit 1
          fi
          echo "static: no NEEDED entries in the dynamic section"

      - name: install.sh fails safely on a version that does not exist
        run: |
          set -euo pipefail
          out=$(DEDALO_VERSION=v0.0.0-does-not-exist \
                DEDALO_INSTALL="$RUNNER_TEMP/bin" sh install.sh 2>&1 || true)
          printf '%s\n' "$out"
          case "$out" in
            *"no build for"*|*"releases"*) echo "failed with a usable message" ;;
            *) echo "::error title=Bad failure mode::install.sh did not explain itself"; exit 1 ;;
          esac
          if [ -e "$RUNNER_TEMP/bin/dedalo" ]; then
            echo "::error title=Unsafe install::a failed download still installed something"
            exit 1
          fi

  semver:
    env:
      # Outranks rust-toolchain.toml, which would otherwise win.
      RUSTUP_TOOLCHAIN: stable
    name: public api compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-semver-checks
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Reports breaking changes against the base branch. It does not fail the
      # build — pre-1.0 they are allowed — but they have to be seen and to end
      # up in the changelog as breaking.
      - name: cargo semver-checks
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cargo semver-checks --baseline-rev "$BASE" --package dedalo \
            2>&1 | tee "$RUNNER_TEMP/semver.txt"
          {
            echo '### Public API'
            echo '```'
            tail -40 "$RUNNER_TEMP/semver.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  verification:
    timeout-minutes: 25
    name: verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # `verification.toml` accounts for every module under src/, and this
      # fails if one is missing, if a declared proof's test is gone, if the
      # money arithmetic in a module moved, or if an exemption stopped being
      # true. It is the gate that makes the manifest mean something.
      - name: every module is accounted for
        run: cargo test --locked --all-features --test verification_manifest

      # Proofs by exhaustion: fifty million fee schedules, every basis-point
      # value, every small weight vector, every tree shape up to sixty-four.
      # Release mode is the difference between half a minute and ten.
      - name: exhaustive proofs
        run: cargo test --locked --release --all-features -- --ignored

      # A "deployable stays deployable" step used to follow, measuring the
      # Stylus contract against the 24 KiB Arbitrum compresses it to. Both are
      # gone: the chain is Solana, and the claim program that replaces the
      # binding is not written. `chain::vault` still holds every rule it must
      # enforce, so what is missing is a binding, not a specification.
      #
      # The step is absent rather than passing over nothing. A gate reporting
      # "pass" for an artifact that does not exist is worse than one visibly
      # missing, and `verification.toml` keeps an empty [contracts] table so a
      # program cannot reappear without someone declaring how it is measured.

  # A single gate for branch protection, so adding a job above does not
  # require reconfiguring the repository.
  ci-ok:
    timeout-minutes: 5
    name: CI
    if: always()
    needs: [lint, test, msrv, docs, coverage, packaging, semver, verification]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all checks passed"
