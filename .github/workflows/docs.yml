name: Docs

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "site/**"
      - "Cargo.*"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    env:
      # Outranks rust-toolchain.toml, which would otherwise win.
      RUSTUP_TOOLCHAIN: nightly
    timeout-minutes: 25
    name: build the site
    runs-on: ubuntu-latest
    outputs:
      pages-available: ${{ steps.pages.outputs.available }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly

      - name: Build the API reference
        env:
          # Broken intra-doc links and undocumented public items fail the
          # build: the reference is generated, so it has to stay correct.
          RUSTDOCFLAGS: -D warnings --cfg docsrs
        run: cargo doc --locked --workspace --no-deps --all-features

      - name: Assemble the published tree
        run: |
          set -eu
          mkdir -p _site
          # The landing page at /, the API reference at /api/.
          cp -r site/. _site/
          mkdir -p _site/api
          cp -r target/doc/. _site/api/
          cat > _site/api/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Dedalo — API reference</title>
          <meta http-equiv="refresh" content="0; url=dedalo_core/index.html">
          <link rel="canonical" href="dedalo_core/index.html">
          <p>Redirecting to the <a href="dedalo_core/index.html">dedalo_core</a> API reference.</p>
          HTML
          # Pages must not run Jekyll over rustdoc's output.
          touch _site/.nojekyll

      - name: Check the assembled site
        run: |
          set -euo pipefail
          # Structure, CSS, metadata and every internal link — resolved
          # against the tree that is about to be published, so a link to the
          # API reference is checked against the API reference that exists.
          scripts/check-site.py --root site --built _site
          test -f _site/api/dedalo_core/index.html
          test -f _site/api/dedalo/index.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          echo "site tree checked and complete" >> "$GITHUB_STEP_SUMMARY"

      - name: Is Pages enabled on this repository?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages not enabled::The site was built and checked but not published. Enable it under Settings → Pages with source 'GitHub Actions'; on a private repository that needs a paid plan."
          fi

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: steps.pages.outputs.available == 'true'
        with:
          path: _site

  # GitHub Pages needs the repository to be public, or the account to be on a
  # paid plan. Until then the site is still built and checked on every push —
  # which is where the value is — and only publishing is skipped, rather than
  # leaving a permanently red workflow on main.
  deploy:
    timeout-minutes: 10
    name: deploy to github pages
    if: needs.build.outputs.pages-available == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
