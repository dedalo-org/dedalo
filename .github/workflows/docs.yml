name: Docs

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "site/**"
      - "scripts/check-book.py"
      - "scripts/check-site.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

# The API reference is not built here any more. docs.rs builds it from the
# published crate, so the reference a reader sees matches the version they
# installed rather than whatever main looked like that morning. `/dedalo/api/`
# stays as a redirect, for the links already out in the world.
env:
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    timeout-minutes: 25
    name: build the handbook
    runs-on: ubuntu-latest
    outputs:
      pages-available: ${{ steps.pages.outputs.available }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Install mdBook
        env:
          VERSION: ${{ env.MDBOOK_VERSION }}
        run: |
          set -euo pipefail
          # Built from source rather than pulled from a third-party action:
          # the version is pinned above, and `--locked` builds it against the
          # dependency set its own release was tested with.
          cargo install mdbook --locked --version "$VERSION"

      - name: Build the handbook
        run: mdbook build book

      - name: Assemble the published tree
        run: |
          set -eu
          mkdir -p _site
          # The handbook at /, the extra pages over the top of it. site/
          # deliberately has no index.html: the book renders one.
          cp -r target/book/. _site/
          cp -r site/. _site/
          # Pages must not run Jekyll over the book's output.
          touch _site/.nojekyll

      - name: Check the assembled site
        run: |
          set -euo pipefail
          # Every internal link and every #anchor, resolved against the tree
          # that is about to be published — so a cross-chapter link is checked
          # against the chapter that exists, not the one that was there when
          # it was written. The sitemap is written from the same tree, because
          # a hand-maintained one lists the pages somebody remembered to add.
          python3 scripts/check-book.py --src book/src --built _site \
            --sitemap _site/sitemap.xml
          # The hand-written pages: structure, CSS, metadata, and the promise
          # that they make no external request.
          python3 scripts/check-site.py --root site --built _site \
            --external-prefix /dedalo/
          test -f _site/index.html
          test -f _site/api/index.html
          test -f _site/sitemap.xml
          echo "handbook checked and complete" >> "$GITHUB_STEP_SUMMARY"

      - name: Is Pages enabled on this repository?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages not enabled::The handbook was built and checked but not published. Enable it under Settings → Pages with source 'GitHub Actions'."
          fi

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: steps.pages.outputs.available == 'true'
        with:
          path: _site

  # Until Pages is enabled the handbook is still built and checked on every
  # push — which is where the value is — and only publishing is skipped,
  # rather than leaving a permanently red workflow on main.
  deploy:
    timeout-minutes: 10
    name: deploy to github pages
    if: needs.build.outputs.pages-available == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
