name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build api reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings --cfg docsrs --enable-index-page -Zunstable-options
        run: cargo doc --workspace --no-deps --all-features
      - name: Land visitors on the core crate
        run: |
          cat > target/doc/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Dedalo — API reference</title>
          <meta http-equiv="refresh" content="0; url=dedalo_core/index.html">
          <link rel="canonical" href="dedalo_core/index.html">
          <p>Redirecting to <a href="dedalo_core/index.html">the Dedalo core API reference</a>.</p>
          HTML
          # Pages must not run Jekyll over rustdoc's output.
          touch target/doc/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc

  deploy:
    name: deploy to github pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
