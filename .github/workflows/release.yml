name: Release

on:
  # A tag pushed by a person triggers this directly.
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.1.0"
        required: true
        type: string
  # A tag created by a workflow does not raise a `push` event — GitHub
  # suppresses events caused by GITHUB_TOKEN to prevent recursion. So the Tag
  # workflow calls this one directly instead of hoping an event fires.
  workflow_call:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.1.0"
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        description: "Token used to publish to crates.io"
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Resolved once, here, rather than repeated at every use site. On a tag push
  # `inputs.tag` is unset and `github.ref_name` is the tag; on a dispatch or a
  # workflow_call it is the other way round. Neither can be a falsy non-empty
  # string, so the fallback is exact.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }} # zizmor: ignore[unsound-ternary]

jobs:
  verify:
    env:
      # Outranks rust-toolchain.toml, which would otherwise win.
      RUSTUP_TOOLCHAIN: stable
    timeout-minutes: 30
    name: verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Configure git for the end-to-end tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features

      - name: The tag must match the workspace version
        id: version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          tag="${TAG#v}"
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match workspace version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: The changelog must describe this version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/changelog-section.py "$VERSION" > /dev/null

  binaries:
    env:
      # Outranks rust-toolchain.toml, which would otherwise win.
      RUSTUP_TOOLCHAIN: stable
    timeout-minutes: 45
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl tooling
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p dedalo --target "$TARGET"
      - name: Package
        shell: bash
        env:
          TAG: ${{ env.RELEASE_TAG }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="dedalo-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          if [ -f "target/${TARGET}/release/dedalo.exe" ]; then
            cp "target/${TARGET}/release/dedalo.exe" "dist/$name/"
          else
            cp "target/${TARGET}/release/dedalo" "dist/$name/"
          fi
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          cd dist
          case "$TARGET" in
            *windows*) 7z a "$name.zip" "$name" > /dev/null ;;
            *) tar czf "$name.tar.gz" "$name" ;;
          esac
          # Checksums let anyone verify a download against the release page.
          for f in "$name".tar.gz "$name".zip; do
            [ -f "$f" ] || continue
            openssl dgst -sha256 -r "$f" | awk '{print $1"  "$2}' > "$f.sha256"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dedalo-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  github-release:
    timeout-minutes: 15
    name: publish the github release
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signing the provenance statement.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Release notes come from the changelog
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          # The backticks below are literal markdown code spans, not command
          # substitution, which is exactly why they are in single quotes.
          # shellcheck disable=SC2016
          {
            scripts/changelog-section.py "$VERSION"
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo 'curl -fsSL https://raw.githubusercontent.com/4137314/dedalo/main/install.sh | sh'
            echo 'cargo install dedalo --locked'
            echo 'cargo binstall dedalo'
            echo "nix profile install github:4137314/dedalo/${TAG}"
            echo '```'
            echo
            echo 'Every archive ships a `.sha256` checksum, and carries signed'
            echo 'build provenance:'
            echo
            echo '```bash'
            echo 'gh attestation verify dedalo-*.tar.gz --repo 4137314/dedalo'
            echo '```'
          } > release-notes.md
      # Signed provenance ties every archive to this repository, this workflow
      # and this commit, so a download can be checked against its origin:
      #   gh attestation verify dedalo-*.tar.gz --repo 4137314/dedalo
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true

  crates-io:
    env:
      # Outranks rust-toolchain.toml, which would otherwise win.
      RUSTUP_TOOLCHAIN: stable
    timeout-minutes: 20
    name: publish to crates.io
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # The library lands first: the CLI depends on the published version.
        run: |
          cargo publish --locked -p dedalo-core
          cargo publish --locked -p dedalo

  container:
    timeout-minutes: 45
    name: publish the container image
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Lay out the binaries the image expects
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          mkdir -p image/amd64 image/arm64
          tar xzf "dist/dedalo-${TAG}-x86_64-unknown-linux-musl.tar.gz" -C dist
          tar xzf "dist/dedalo-${TAG}-aarch64-unknown-linux-musl.tar.gz" -C dist
          cp "dist/dedalo-${TAG}-x86_64-unknown-linux-musl/dedalo" image/amd64/dedalo
          cp "dist/dedalo-${TAG}-aarch64-unknown-linux-musl/dedalo" image/arm64/dedalo
          chmod +x image/*/dedalo
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
