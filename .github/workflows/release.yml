name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Configure git for the end-to-end tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

      - name: The tag must match the workspace version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          tag="${tag#v}"
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match workspace version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: The changelog must describe this version
        run: scripts/changelog-section.py "${{ steps.version.outputs.version }}" > /dev/null

  binaries:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tooling
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked -p dedalo --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          name="dedalo-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ -f "target/${{ matrix.target }}/release/dedalo.exe" ]; then
            cp "target/${{ matrix.target }}/release/dedalo.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/dedalo" "dist/$name/"
          fi
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          # Checksums let anyone verify a download against the release page.
          for f in "$name".tar.gz "$name".zip; do
            [ -f "$f" ] || continue
            openssl dgst -sha256 -r "$f" | awk '{print $1"  "$2}' > "$f.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dedalo-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  github-release:
    name: publish the github release
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes come from the changelog
        run: |
          {
            scripts/changelog-section.py "${{ needs.verify.outputs.version }}"
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo 'curl -fsSL https://raw.githubusercontent.com/4137314/dedalo/main/install.sh | sh'
            echo 'cargo install dedalo --locked'
            echo 'cargo binstall dedalo'
            echo 'nix profile install github:4137314/dedalo/${{ inputs.tag || github.ref_name }}'
            echo '```'
            echo
            echo 'Every archive ships a `.sha256` checksum next to it.'
          } > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true

  crates-io:
    name: publish to crates.io
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # The library lands first: the CLI depends on the published version.
        run: |
          cargo publish --locked -p dedalo-core
          cargo publish --locked -p dedalo

  container:
    name: publish the container image
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Lay out the binaries the image expects
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          mkdir -p image/amd64 image/arm64
          tar xzf "dist/dedalo-${TAG}-x86_64-unknown-linux-musl.tar.gz" -C dist
          tar xzf "dist/dedalo-${TAG}-aarch64-unknown-linux-musl.tar.gz" -C dist
          cp "dist/dedalo-${TAG}-x86_64-unknown-linux-musl/dedalo" image/amd64/dedalo
          cp "dist/dedalo-${TAG}-aarch64-unknown-linux-musl/dedalo" image/arm64/dedalo
          chmod +x image/*/dedalo
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
