name: Release

on:
  # A tag pushed by a person triggers this directly.
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.0.1"
        required: true
        type: string
  # A tag created by a workflow does not raise a `push` event — GitHub
  # suppresses events caused by GITHUB_TOKEN to prevent recursion. So the Tag
  # workflow calls this one directly instead of hoping an event fires.
  workflow_call:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.0.1"
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        description: "Token used to publish to crates.io"
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Resolved once, here, rather than repeated at every use site. On a tag push
  # `inputs.tag` is unset and `github.ref_name` is the tag; on a dispatch or a
  # workflow_call it is the other way round. Neither can be a falsy non-empty
  # string, so the fallback is exact.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }} # zizmor: ignore[unsound-ternary]

jobs:
  verify:
    env:
      # Outranks rust-toolchain.toml, which would otherwise win.
      RUSTUP_TOOLCHAIN: stable
    timeout-minutes: 30
    name: verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Configure git for the end-to-end tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features

      - name: The tag must match the workspace version
        id: version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          tag="${TAG#v}"
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match workspace version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: The changelog must describe this version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/changelog-section.py "$VERSION" > /dev/null

  binaries:
    env:
      # Outranks rust-toolchain.toml, which would otherwise win.
      RUSTUP_TOOLCHAIN: stable
    timeout-minutes: 45
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl tooling
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p dedalo --target "$TARGET"
      - name: Package
        shell: bash
        env:
          TAG: ${{ env.RELEASE_TAG }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="dedalo-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          if [ -f "target/${TARGET}/release/dedalo.exe" ]; then
            cp "target/${TARGET}/release/dedalo.exe" "dist/$name/"
          else
            cp "target/${TARGET}/release/dedalo" "dist/$name/"
          fi
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          cd dist
          case "$TARGET" in
            *windows*) 7z a "$name.zip" "$name" > /dev/null ;;
            *) tar czf "$name.tar.gz" "$name" ;;
          esac
          # Checksums let anyone verify a download against the release page.
          for f in "$name".tar.gz "$name".zip; do
            [ -f "$f" ] || continue
            openssl dgst -sha256 -r "$f" | awk '{print $1"  "$2}' > "$f.sha256"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dedalo-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  github-release:
    timeout-minutes: 15
    name: publish the github release
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signing the provenance statement.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Release notes come from the changelog
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # The backticks below are literal markdown code spans, not command
          # substitution, which is exactly why they are in single quotes.
          # shellcheck disable=SC2016
          {
            scripts/changelog-section.py "$VERSION"
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo 'curl -fsSL https://raw.githubusercontent.com/dedalo-org/dedalo/main/install.sh | sh'
            echo 'cargo install dedalo --locked'
            echo 'cargo binstall dedalo'
            echo '```'
            echo
            echo 'Every archive ships a `.sha256` checksum, and carries signed'
            echo 'build provenance:'
            echo
            echo '```bash'
            echo 'gh attestation verify dedalo-*.tar.gz --repo dedalo-org/dedalo'
            echo '```'
          } > release-notes.md
      # Signed provenance ties every archive to this repository, this workflow
      # and this commit, so a download can be checked against its origin:
      #   gh attestation verify dedalo-*.tar.gz --repo dedalo-org/dedalo
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true

  crates-io:
    env:
      # Outranks rust-toolchain.toml, which would otherwise win.
      RUSTUP_TOOLCHAIN: stable
    timeout-minutes: 20
    name: publish to crates.io
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      # Trusted Publishing. This is the whole point: crates.io mints a token
      # that lives thirty minutes, for this repository and this workflow, in
      # exchange for a signed OIDC claim GitHub issues at run time. There is no
      # long-lived registry token in this repository's secrets, so there is
      # none to leak, rotate, or find in a fork's pull request.
      #
      # It is also Decision 2 of docs/settlement-architecture.md applied to the
      # thing that ships the code rather than to the thing that moves money —
      # the same argument, and it happens to be the industry default now.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      # A release can be re-run: a tag rebuilt after a transient failure, a
      # dispatch to regenerate binaries, a GitHub release recreated. Publishing
      # is the one step that cannot be repeated — crates.io refuses a version
      # it already has, and the job would fail on a release that had otherwise
      # succeeded. So the question is asked first.
      - name: Is this version already on crates.io?
        id: published
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # A hard failure here must not be read as "not published": that would
          # publish over a network blip. Only an answer counts.
          body=$(curl -fsS --retry 3 --max-time 30 \
            -H 'User-Agent: dedalo-release (github.com/dedalo-org/dedalo)' \
            "https://crates.io/api/v1/crates/dedalo/$VERSION" || echo '')
          if [ -z "$body" ]; then
            echo "::error title=crates.io unreachable::cannot tell whether $VERSION is published; refusing to guess"
            exit 1
          fi
          if printf '%s' "$body" | grep -q '"num"'; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Already published::dedalo $VERSION is on crates.io; skipping the publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get a short-lived crates.io token
        if: steps.published.outputs.already == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        if: steps.published.outputs.already == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # One crate, one publish: the library and the binary ship together.
        run: cargo publish --locked
