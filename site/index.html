<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dedalo — documentation</title>
<meta name="description" content="Documentation for Dedalo: the API reference, generated by rustdoc from the crate itself.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<!-- No scripts and no remote resources, so the redirect below is a meta
     refresh rather than a location assignment. scripts/check-site.py fails
     the build if either ever appears. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
<meta http-equiv="refresh" content="0; url=api/">
<meta name="theme-color" content="#0b0d0b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f1ea" media="(prefers-color-scheme: light)">
<!-- The reference is the page, so it is also the canonical one. Without this
     the redirect and its destination compete for the same content. -->
<link rel="canonical" href="https://dedalo-org.github.io/dedalo/api/">
<style>
  :root {
    color-scheme: dark light;
    --bg: #0b0d0b;
    --fg: #d7dbd4;
    --dim: #6f776c;
    --hi: #7ee787;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f2f1ea; --fg: #24281f; --dim: #6b7264; --hi: #1a7f37; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-content: center;
    gap: 1rem;
    padding: 2rem;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    text-align: center;
  }
  h1 { font-size: 1rem; font-weight: 600; margin: 0; letter-spacing: .02em; }
  p { margin: 0; color: var(--dim); }
  .links { display: flex; gap: 1.25rem; justify-content: center; flex-wrap: wrap; }
  a { color: var(--hi); text-decoration: none; border-bottom: 1px solid currentColor; }
  a:hover { opacity: .8; }
</style>
</head>
<body>
  <h1>dedalo · documentation</h1>
  <p>redirecting to the api reference&hellip;</p>
  <div class="links">
    <a href="api/">api reference</a>
    <a href="https://dedalo-org.github.io/">dedalo-org</a>
    <a href="https://github.com/dedalo-org/dedalo">source</a>
  </div>
</body>
</html>
