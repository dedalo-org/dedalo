# git-cliff: the changelog is generated from commit subjects, which is why
# pull request titles are checked against Conventional Commits.
# Regenerate with: git cliff --tag v<version> --output CHANGELOG.md

[changelog]
header = """
# Changelog

All notable changes to Dedalo are recorded here.

The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and
this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
Both crates in the workspace share one version and one tag.

"""

body = """
{% if version %}\
{% if previous and previous.version %}\
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/dedalo-org/dedalo/compare/{{ previous.version }}...{{ version }}) — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/dedalo-org/dedalo/releases/tag/{{ version }}) — {{ timestamp | date(format="%Y-%m-%d") }}
{% endif %}\
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.breaking %} **(breaking)**{% endif %} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/dedalo-org/dedalo/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}

"""

footer = """
<!-- Generated by git-cliff from Conventional Commit subjects. -->
"""

# Whitespace is controlled explicitly in the template above.
trim = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "newest"

commit_parsers = [
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Changed" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^test", group = "<!-- 6 -->Tests" },
  { message = "^build|^ci", group = "<!-- 7 -->Infrastructure" },
  { message = "^chore\\(deps\\)", group = "<!-- 7 -->Infrastructure" },
  { message = "^revert", group = "<!-- 8 -->Reverted" },
  # Release commits are bookkeeping; they say nothing a reader needs.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", skip = true },
]

commit_preprocessors = [
  # Turn bare issue references into links.
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/dedalo-org/dedalo/issues/${2}))" },
]
