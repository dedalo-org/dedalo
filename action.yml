name: Dedalo
description: Turn merged pull requests into contributor payouts, from your own pipeline
author: Dedalo contributors

branding:
  icon: git-merge
  color: purple

inputs:
  version:
    description: "Release to use, e.g. v0.1.0. Defaults to the latest release."
    required: false
    default: latest
  command:
    description: "Subcommand to run: status, scan, contributors, plan or settle."
    required: false
    default: status
  amount:
    description: "Size of the round, for `plan` and `settle`, in the configured asset."
    required: false
    default: ""
  since:
    description: "Start after this revision instead of the last settled commit."
    required: false
    default: ""
  execute:
    description: >
      Broadcast for real instead of simulating. Requires the signing key in the
      environment variable named by `settlement.signer_env`. Defaults to false,
      because the safe thing must be the default.
    required: false
    default: "false"
  working-directory:
    description: "Repository to operate on."
    required: false
    default: "."
  summary:
    description: "Write the payout plan to the workflow run summary."
    required: false
    default: "true"

outputs:
  json:
    description: "Raw JSON output of the command."
    value: ${{ steps.run.outputs.json }}
  plan-id:
    description: "Content hash of the payout plan, when the command produced one."
    value: ${{ steps.run.outputs.plan-id }}
  total:
    description: "Total that would move, in base units."
    value: ${{ steps.run.outputs.total }}

runs:
  using: composite
  steps:
    - name: Check out history if the caller has not
      shell: bash
      run: |
        # Attribution reads merge history: a shallow clone silently produces
        # an empty round rather than an error.
        cd "${{ inputs.working-directory }}"
        if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
          echo "::warning title=Shallow clone::dedalo needs full history; fetching it now. Set fetch-depth: 0 on actions/checkout to avoid this."
          git fetch --unshallow --quiet || true
        fi

    - name: Install dedalo
      shell: bash
      env:
        DEDALO_VERSION: ${{ inputs.version == 'latest' && '' || inputs.version }}
        DEDALO_INSTALL: ${{ runner.temp }}/dedalo-bin
      run: |
        set -euo pipefail
        "${{ github.action_path }}/install.sh"
        echo "${{ runner.temp }}/dedalo-bin" >> "$GITHUB_PATH"

    - name: Run dedalo ${{ inputs.command }}
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        args=("${{ inputs.command }}")
        if [ -n "${{ inputs.amount }}" ]; then
          args+=(--amount "${{ inputs.amount }}")
        fi
        if [ -n "${{ inputs.since }}" ]; then
          args+=(--since "${{ inputs.since }}")
        fi
        if [ "${{ inputs.execute }}" = "true" ]; then
          if [ "${{ inputs.command }}" != "settle" ]; then
            echo "::error title=Invalid input::execute: true only applies to the settle command"
            exit 1
          fi
          args+=(--execute)
        fi

        # `settle` has side effects, so it runs exactly once and only in JSON
        # form. The read-only commands can afford a second, prettier pass.
        if [ "${{ inputs.command }}" != "settle" ]; then
          dedalo "${args[@]}" | tee "${RUNNER_TEMP}/dedalo-human.txt"
        fi

        json=$(dedalo --json "${args[@]}")
        printf '%s\n' "$json"

        {
          echo "json<<DEDALO_EOF"
          printf '%s\n' "$json"
          echo "DEDALO_EOF"
        } >> "$GITHUB_OUTPUT"

        plan_id=$(printf '%s' "$json" | grep -o '"id": *"[^"]*"' | head -1 | cut -d'"' -f4 || true)
        total=$(printf '%s' "$json" | grep -o '"gross": *"[^"]*"' | head -1 | cut -d'"' -f4 || true)
        echo "plan-id=${plan_id}" >> "$GITHUB_OUTPUT"
        echo "total=${total}" >> "$GITHUB_OUTPUT"

    - name: Write the result to the run summary
      if: inputs.summary == 'true'
      shell: bash
      env:
        DEDALO_JSON: ${{ steps.run.outputs.json }}
      run: |
        set -euo pipefail
        {
          echo "## Dedalo — ${{ inputs.command }}"
          echo
          echo '```'
          # Reuse what already ran: never invoke the command a second time.
          if [ -s "${RUNNER_TEMP}/dedalo-human.txt" ]; then
            cat "${RUNNER_TEMP}/dedalo-human.txt"
          else
            printf '%s\n' "$DEDALO_JSON"
          fi
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
