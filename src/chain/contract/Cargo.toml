[package]
name = "dedalo-vault"
description = "The Dedalo claim vault, as an Arbitrum Stylus contract."
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
license = "MIT"
repository = "https://github.com/dedalo-org/dedalo"
authors = ["Dedalo contributors"]
publish = false

# Deliberately not a member of any workspace. It compiles for
# wasm32-unknown-unknown and links a different std; building it alongside the
# host crate would mean one lockfile trying to satisfy two targets at once.
[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
# The rules. Not reimplemented here — this crate is a binding, and the
# `vault` module is what it binds to.
dedalo = { path = "../../..", default-features = false }
stylus-sdk = "0.10"
# Named directly because the `sol!` macro expands to `alloy_sol_types::…`
# paths, which only resolve when the crate is a direct dependency. Pinned to
# what the SDK carries, so one version of the ABI types exists and not two.
alloy-sol-types = { version = "1.5.7", default-features = false }

[features]
# `cargo stylus` sets this when it exports the ABI.
export-abi = ["stylus-sdk/export-abi"]

[profile.release]
# What goes on chain is paid for by the byte.
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
strip = true
