# ----------------------------------------------------------- deployable ---

[contracts."src/chain/contract"]
method = "binding"
target = "wasm32-unknown-unknown"
# Stylus rejects anything larger, compressed. Measured by `ws-check`, because a
# contract that cannot be deployed is not a contract.
max_compressed_kib = 24
notes = """
An Arbitrum Stylus contract, and deliberately thin: every rule it enforces is \
`chain::vault`, which is ordinary Rust and tested here. What is in the crate \
is the part that cannot be pure — reading storage, moving a token, knowing the \
time — and a reader checking whether it is correct should end up in `vault`.

Unaudited and undeployed. Nothing here has held a coin."""
