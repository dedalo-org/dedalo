# How every module in this crate is verified.
#
# `tests/verification_manifest.rs` fails the build unless this file accounts
# for every module under `src/`, so a new one cannot be added without someone
# deciding what verifies it. It also counts the money arithmetic in each module
# and compares it to `arithmetic_sites`: if the count moves, the build fails
# and the change has to be looked at rather than absorbed.
#
# The methods, strongest first. The distinction is not decoration:
#
#   exhaustive  Every value in a complete finite domain is tried. Passing is a
#               proof that no counterexample exists in that domain.
#   property    Generated inputs. Thousands of samples, not a proof — a rare
#               counterexample can survive it, and one did: see the EIP-55
#               collisions pinned in tests/adversarial.rs.
#   tests       Hand-picked cases only.
#   proofs      The module is not verified; it *is* verification. A `proofs.rs`
#               compiles only under `cfg(test)` and ships in no release.
#   exempt      Nothing here decides how much money moves or where it goes.
#               Must have zero arithmetic sites, and must not build an Address.
#
# Being honest about which is which is the point. A module marked `property` is
# not proved, and this file is where that is admitted rather than implied.

[meta]
# Bumped when the meaning of a method changes, so a stale manifest is visible.
schema = 2

# ---------------------------------------------------------------- proved ---

[modules.money]
method = "exhaustive"
arithmetic_sites = 10
harnesses = [
  "money::proofs::every_basis_point_value_rounds_down_and_never_exceeds_the_input",
  "money::proofs::every_small_weight_vector_conserves_the_total",
]
notes = """
Exhaustive over all 65,536 basis-point values and over every weight vector of \
up to four entries with weights 0..=6. Longer vectors and larger weights are \
sampled by the property tests in the same file, not proved."""

[modules."money/treasury"]
method = "exhaustive"
arithmetic_sites = 5
harnesses = ["money::proofs::every_valid_fee_schedule_conserves_the_round"]
notes = """
Exhaustive over all 50,005,000 fee schedules `validate` accepts. The gross \
amount is not enumerable, so it is pinned to the values where integer \
arithmetic breaks."""

[modules."chain/merkle"]
method = "exhaustive"
arithmetic_sites = 2
harnesses = [
  "chain::merkle::every_tree_size_up_to_sixty_four_proves_exactly_its_own_claims",
  "chain::merkle::the_leaf_encoding_has_not_moved",
]
notes = """
Exhaustive over every tree size from one to sixty-four, which covers every \
shape the odd-node promotion rule produces. The leaf encoding is pinned \
separately: it is what a deployed vault verifies proofs against, so changing \
it silently would invalidate every round already deposited."""

# ------------------------------------------------------------- sampled ---

[modules.payout]
method = "property"
arithmetic_sites = 13
harnesses = [
  "payout::proofs::plans_always_balance_and_verify",
  "payout::proofs::plan_ids_ignore_the_clock",
  "payout::proofs::tampering_with_a_plan_breaks_its_id",
  "payout::proofs::one_wallet_is_paid_once",
  "adversarial::every_base_unit_is_assigned_or_declared",
  "adversarial::a_round_with_no_payees_declares_the_whole_pool",
]
notes = """
A plan's shape depends on a config, an attribution and a range together, and \
that product is not a finite domain worth enumerating. Sampled instead."""

[modules.attribution]
method = "property"
arithmetic_sites = 6
harnesses = [
  "adversarial::attribution_survives_hostile_commit_metadata",
  "adversarial::extreme_policies_saturate_rather_than_wrap",
]
notes = """
Scores in milli-points rather than `Amount`, which is why the arithmetic \
detector counts `saturating_*` as well: counting only `Amount` would let the \
module that decides who is owed what look arithmetic-free."""

[modules."chain/wallet"]
method = "property"
arithmetic_sites = 0
harnesses = [
  "adversarial::a_mutated_address_parses_exactly_when_its_checksum_is_valid",
  "adversarial::address_parsing_never_panics",
]
notes = """
No arithmetic, but it decides *where* money lands, so it may not be exempt. \
The property compares against an independent EIP-55 implementation in both \
directions."""

[modules."storage/ledger"]
method = "property"
arithmetic_sites = 7
harnesses = ["storage::ledger::lifetime_paid_is_the_sum_of_the_settlements_that_were_not_simulated"]
notes = """
The only place outside `payout` that accumulates rather than carries: \
`state()` replays the chain into lifetime totals."""

# --------------------------------------------------------------- tested ---

[modules."chain/vault"]
method = "tests"
arithmetic_sites = 4
notes = """
The rules a deployed vault enforces, and the one part of this system that \
cannot be patched after it ships. Thirteen tests, one per way it must refuse: \
the replay guard, double claims, inflated amounts, redirected recipients, \
borrowed proofs, a round whose accounting is broken, expiry, sweep \
authorisation, and a token that under-delivers. `Refusal` is the \
specification, and a test asserts no two refusals share a sentence."""

[modules."chain/vault/round"]
method = "tests"
arithmetic_sites = 1
notes = "The round record. Its invariant is exercised through chain/vault."

[modules.config]
method = "tests"
arithmetic_sites = 0
notes = "Builds Addresses from a file, so not exempt. Unit tests and tests/cli.rs."

[modules."attribution/identity"]
method = "tests"
arithmetic_sites = 0
notes = "Maps git emails to Addresses."

[modules."storage/objects"]
method = "tests"
arithmetic_sites = 0
notes = """
No arithmetic, but an id here becomes a filesystem path. The unit tests \
enumerate the hostile shapes rather than sample them."""

[modules."chain/settlement/abi"]
method = "tests"
arithmetic_sites = 1
notes = """
Carries amounts into calldata; it does not decide them. The encoder is \
`alloy-sol-types` rather than hand-written, and the selectors are still \
checked against the canonical published values so swapping the library out \
cannot silently change what a signer is asked to sign."""

[modules."chain/settlement/proposal"]
method = "tests"
arithmetic_sites = 2
notes = "Reads the tree's total and encodes it. Decides nothing."

[modules."chain/settlement/dry_run"]
method = "tests"
arithmetic_sites = 0
notes = "Sums a plan it was given, for a receipt."

[modules."cli/commands/plan"]
method = "tests"
arithmetic_sites = 3
notes = """
Sums item amounts to print a total. Display only — the plan it prints was \
decided by `payout`. tests/cli.rs pins the --json shape."""

[modules."cli/commands/identity"]
method = "tests"
arithmetic_sites = 0
notes = "Parses the address a user types, and warns on a weak checksum."

# --------------------------------------------------------------- proofs ---

[modules."money/proofs"]
method = "proofs"
arithmetic_sites = 34
notes = "The exhaustive and property suites for money and treasury."

[modules."payout/proofs"]
method = "proofs"
arithmetic_sites = 5
notes = "The property suite for the plan."

