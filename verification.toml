# ----------------------------------------------------------- deployable ---

# Empty, and that is the current truth. The Arbitrum Stylus binding was
# discarded when the chain became Solana: it was written against a 24 KiB
# compressed budget that no longer applies, and it held raw twenty-byte
# addresses because of it.
#
# The claim program that replaces it is not written. `chain/vault` still holds
# every rule it must enforce, still pure and still tested over its whole
# domain, so what is missing is a binding and not a specification. This table
# stays so that a program cannot reappear without someone declaring how it is
# verified and what it is measured against.

[contracts]
