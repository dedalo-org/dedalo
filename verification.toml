[modules."chain/settlement/solana"]
method = "tests"
arithmetic_sites = 0
notes = """
Was exempt, and the manifest gate refused to let it stay so: it now parses the \
configured program id as an `Address`, and a module that builds an address \
decides *where* even when it decides no amount. A program id that is not \
thirty-two bytes names nothing, and this is where that is caught — before a \
proposal a signer would be asked to trust."""

